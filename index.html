<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Protech Resto · Pedidos y comandas</title>
<meta name="theme-color" content="#0284c7">
<style>
:root{--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--brand:#0284c7;--brand-d:#0369a1;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
input,select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(2,132,199,.15)}
.btn{background:var(--brand);color:#fff}.btn:hover{background:var(--brand-d)}
.btn-ok{background:var(--ok);color:#fff}.btn-bad{background:#fee2e2;color:var(--bad)}.btn-line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled,.btn-ok:disabled{opacity:.45;cursor:not-allowed}
header{background:#0b1a2b;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header b{font-size:1.05rem}header small{color:#93c5fd;display:block;font-size:.75rem}
nav{display:flex;gap:6px;flex:1;overflow-x:auto}
nav button{background:transparent;color:#cbd5e1;padding:8px 12px}
nav button.on{background:var(--brand);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:1.25rem;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mesa{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center}
.mesa b{display:block;font-size:1.5rem}.mesa span{font-size:.8rem;color:var(--mut)}
.mesa.ocu{border-color:var(--warn);background:#fffbeb}.mesa.lis{border-color:var(--ok);background:#f0fdf4}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.cols{display:grid;gap:16px;grid-template-columns:1fr 340px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.q{display:flex;align-items:center;gap:8px}.q button{width:34px;height:34px;padding:0;background:var(--line)}.q span{min-width:20px;text-align:center;font-weight:700}
.piso{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:18px 0 8px;font-weight:700}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:14px 0 4px;font-weight:700}
.kan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.col h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.tk{background:#fff;border-left:5px solid var(--warn);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.tk.p2{border-color:var(--brand)}.tk.p3{border-color:var(--ok)}
.tk h4{display:flex;justify-content:space-between}.tk ul{margin:8px 0 10px 18px;font-size:.95rem}
.tk em{display:block;color:var(--bad);font-size:.85rem;margin-bottom:8px}
.pill{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut);font-weight:700}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding-top:10px}
.mut{color:var(--mut);font-size:.9rem}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{display:grid;gap:12px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
.stat b{display:block;font-size:1.6rem}
.hint{font-size:.8rem;color:var(--mut);background:#f8fafc;border-radius:10px;padding:10px}
.off{opacity:.45}
#toast{position:fixed;left:12px;right:12px;top:64px;z-index:50;display:grid;gap:8px;pointer-events:none}
#toast div{pointer-events:auto;padding:14px 16px;border-radius:12px;color:#fff;font-weight:800;font-size:1.1rem;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pulso .8s ease-in-out 6}
#toast .tk-c{background:var(--bad)}#toast .tk-l{background:var(--ok)}
@keyframes pulso{50%{transform:scale(1.03);filter:brightness(1.25)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================
   PROTECH RESTO — conectado a Supabase
   Cada local entra con su correo y clave (cuentas creadas por Protech)
   y solo ve sus propios datos (seguridad RLS en la base).
   ===================================================== */
const SB_URL = 'https://fchqqtdapyrgpkyxiful.supabase.co';
const SB_KEY = 'sb_publishable_7jjHrGLPJ51aP0BKwcIizg_bakLNqiY';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(n).toLocaleString('es-CL');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mins = t => Math.max(0, Math.round((Date.now() - t) / 60000));

let D = null; // datos del local: {id,name,mesas,menu,comandas,cuentas}
let S = { garzon: '', rp: null, rpd: null, rph: null, user: null, loading: true, view: 'mesas', mesa: null, cart: {}, note: '', cerrando: false, parcial: false, sel: {}, propina: true, metodo: 'Efectivo', err: '', ok: '', busy: false, setpass: false, olvide: false, admin: false, rol: null, quien: '', f: {}, np: null, th: null, qk: null, pinErr: '', av: { locales: [], cargado: false, msg: '', err: '' }, af: { nombre: '', mesas: '6', email: '' } };
const L = () => D;
const extraCuenta = () => ({ ...(D.turno ? { turno_id: D.turno.id } : {}), ...(S.quien ? { cobrado_por: S.quien } : {}) });
/* ---------- Roles y PIN ----------
   Si el local tiene PIN de administradora, cada persona elige quién es y entra con su PIN.
   Administradora: todo. Garzón: solo Mesas (tomar pedidos y cobrar). Cocina: Cocina y Cafetería.
   Si el local aún no configuró PIN, funciona como siempre (todo visible). */
const rolesOn = () => !!(D && D.adminPin);
const esAdm = () => !rolesOn() || S.rol === 'admin';
const TABS = { admin: ['mesas', 'cocina', 'cafe', 'resv', 'turno', 'caja', 'inv', 'garz', 'carta'], garzon: ['mesas'], cocina: ['cocina', 'cafe'] };
const misTabs = () => !rolesOn() ? TABS.admin : (TABS[S.rol] || []);
async function hpin(scope, pin) {
  const b = new TextEncoder().encode(D.id + ':' + scope + ':' + pin);
  const h = await crypto.subtle.digest('SHA-256', b);
  return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function entrar(rol, quien) {
  S.rol = rol; S.quien = quien; S.qk = null; S.pinErr = ''; S.mesa = null;
  S.garzon = rol === 'garzon' ? quien : '';
  S.view = misTabs()[0];
  try { sessionStorage.setItem('pr-rol', JSON.stringify({ lid: D.id, rol, quien })); } catch (e) {}
}
function restaurarRol() {
  if (!rolesOn() || S.rol) return;
  try {
    const r = JSON.parse(sessionStorage.getItem('pr-rol') || 'null');
    if (r && r.lid === D.id && (r.rol === 'admin' || r.rol === 'cocina' || (r.rol === 'garzon' && D.garzones.some(g => g.n === r.quien && g.on)))) { S.rol = r.rol; S.quien = r.quien; S.garzon = r.rol === 'garzon' ? r.quien : ''; S.view = misTabs()[0]; }
  } catch (e) {}
}
function quienHTML() {
  const g = D.garzones.filter(x => x.on);
  const opt = (k, n, sub) => `<button class="mesa" style="width:100%" data-act="qsel" data-k="${esc(k)}"><b style="font-size:1.1rem">${esc(n)}</b><span>${sub}</span></button>`;
  let sel = '';
  if (S.qk) {
    const nombre = S.qk === 'admin' ? 'Administradora' : S.qk.slice(2);
    sel = `<div class="card" style="margin-top:12px;display:grid;gap:10px"><b>${esc(nombre)}</b>
      <label class="mut">Tu PIN<input id="qpin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" autofocus></label>
      ${S.pinErr ? `<div style="color:var(--bad);font-size:.9rem">${esc(S.pinErr)}</div>` : ''}
      <div style="display:flex;gap:8px"><button class="btn" style="flex:1" data-act="qok">Entrar</button><button class="btn-line" data-act="qback">Volver</button></div></div>`;
  }
  return `<header><div><b>${esc(D.name)}</b><small>Protech Resto</small></div><nav></nav><button class="btn-line" style="padding:6px 12px" data-act="logout">Salir</button></header>
  <main><h2>¿Quién eres?</h2><div class="grid">${opt('admin', 'Administradora', 'Todo el local')}${g.map(x => opt('g:' + x.n, x.n, 'Mesas y cobros')).join('')}${opt('cocina', 'Cocina', 'Comandas')}</div>${sel}</main>`;
}

const abiertas = m => L().comandas.filter(c => !c.cerrada && c.mesa === m);
/* i.pg = unidades de ese producto que un cliente ya pagó por separado (cobro parcial) */
const totalMesa = m => abiertas(m).reduce((a, c) => a + c.items.reduce((s, i) => s + (i.q - (i.pg || 0)) * i.p, 0), 0);
const pagada = c => c.items.every(i => (i.pg || 0) >= i.q);
/* las mesas del piso 2 se guardan como 101, 102… (así no chocan con las del piso 1) */
const nm = m => {
  if (m >= 1000) { const p = (D && D.pedidos || []).find(x => x.num === m); return p ? (p.tipo === 'delivery' ? 'Delivery' : 'Para llevar') + ' #' + (m - 1000) + (p.cliente ? ' · ' + esc(p.cliente) : '') : 'Pedido #' + (m - 1000); }
  return m > 100 ? 'Piso 2 · Mesa ' + (m - 100) : 'Mesa ' + m;
};
const fv = k => esc(S.f[k] ?? '');
const pedDe = n => ((D && D.pedidos) || []).find(p => p.num === n);
const cajaAbierta = () => !rolesOn() || !!D.turno;
const hoyIso = () => fechaIso(new Date());
const resDe = n => ((D && D.reservas) || []).filter(r => r.mesa === n && r.estado === 'pendiente' && r.fecha === hoyIso()).sort((a, b) => a.hora.localeCompare(b.hora))[0];
const bajoStock = () => L().menu.filter(i => i.s != null && i.s <= i.sm);
const hoy = t => new Date(t).toDateString() === new Date().toDateString();

/* ---------- Sonidos y avisos ---------- */
const SNDL = { ambos: 'todo', cocina: 'solo cocina', salon: 'solo salón', off: 'apagado' };
const esCafe = c => c.est === 'cafeteria';
let SND = 'ambos'; try { SND = localStorage.getItem('pr-snd') || 'ambos'; } catch (e) {}
if (!SNDL[SND]) SND = 'ambos';
let AC = null;
function ctx() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch (e) { return null; } }
function tono(f, t0, dur, tipo, vol) {
  const c = ctx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.type = tipo; o.frequency.value = f; o.connect(g); g.connect(c.destination);
  const t = c.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function vibra(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function sonarCocina() { for (let i = 0; i < 3; i++) { tono(988, i * 0.75, 0.32, 'square', 0.9); tono(1319, i * 0.75 + 0.36, 0.32, 'square', 0.9); } vibra([300, 150, 300, 150, 300]); }
function sonarListo() { tono(784, 0, 0.35, 'sine', 0.8); tono(1047, 0.3, 0.35, 'sine', 0.8); tono(1319, 0.6, 0.7, 'sine', 0.8); vibra([200, 100, 200]); }
let toastT = null;
function toast(txt, cls) {
  const el = $('#toast'); if (!el) return;
  el.innerHTML = `<div class="${cls}">${esc(txt)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => { el.innerHTML = ''; }, 12000);
}
document.addEventListener('pointerdown', () => ctx());
document.addEventListener('click', e => { if (e.target.closest('#toast')) $('#toast').innerHTML = ''; });
function avisar(prev) {
  const nuevos = D.comandas.filter(c => !prev.has(c.id) && c.estado === 'pendiente');
  /* la cafetería entra ya "entregada" (la preparan y sirven los garzones), así que solo la cocina avisa */
  const nuevosCocina = nuevos.filter(c => !esCafe(c));
  const listos = D.comandas.filter(c => c.estado === 'listo' && prev.get(c.id) !== 'listo' && !esCafe(c));
  if (nuevosCocina.length && (SND === 'cocina' || SND === 'ambos')) { sonarCocina(); toast('NUEVA COMANDA · ' + nuevosCocina.map(c => nm(c.mesa)).join(', '), 'tk-c'); }
  if (listos.length && (SND === 'salon' || SND === 'ambos')) { sonarListo(); toast('PEDIDO LISTO · ' + listos.map(c => nm(c.mesa)).join(', '), 'tk-l'); }
}
let WL = null;
async function pantalla() { try { if (SND !== 'off' && 'wakeLock' in navigator && !WL && !document.hidden) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => { WL = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) pantalla(); });

async function llamarAdmin(body) {
  const { data } = await sb.auth.getSession();
  const r = await fetch(SB_URL + '/functions/v1/admin-resto', { method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + (data.session ? data.session.access_token : '') },
    body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || j.message || ('Error ' + r.status));
  return j;
}
async function adminCargar() {
  try { const j = await llamarAdmin({ action: 'list' }); S.av.locales = j.locales; S.av.err = ''; S.av.cargado = true; }
  catch (e) { S.av.err = e.message; S.av.cargado = true; }
  render();
}
async function cargar() {
  S.admin = !!(S.user && S.user.app_metadata && S.user.app_metadata.role === 'protech_admin');
  if (S.admin && !S.av.cargado) adminCargar();
  const { data: mi } = await sb.from('resto_miembros').select('local_id').maybeSingle();
  if (!mi && S.admin) { D = null; S.view = 'admin'; return; }
  if (!mi) { S.err = 'Tu cuenta aún no tiene un local asignado. Avisa a Protech.'; await sb.auth.signOut(); S.user = null; D = null; return; }
  const id = mi.local_id, desde = new Date(); desde.setHours(0, 0, 0, 0); desde.setDate(desde.getDate() - 1);
  const [loc, menu, com, cue, gar, tur, ped, res] = await Promise.all([
    sb.from('resto_locales').select('*').eq('id', id).single(),
    sb.from('resto_menu').select('*').eq('local_id', id).order('categoria').order('nombre'),
    sb.from('resto_comandas').select('*').eq('local_id', id).eq('cerrada', false),
    sb.from('resto_cuentas').select('*').eq('local_id', id).gte('created_at', desde.toISOString()),
    sb.from('resto_garzones').select('*').eq('local_id', id).order('nombre'),
    sb.from('resto_turnos').select('*').eq('local_id', id).is('cerrado_at', null).order('abierto_at', { ascending: false }).limit(1),
    sb.from('resto_pedidos').select('*').eq('local_id', id).eq('cerrado', false).order('num'),
    sb.from('resto_reservas').select('*').eq('local_id', id).gte('fecha', fechaIso(new Date())).order('fecha').order('hora')
  ]);
  if (loc.error) { S.err = 'No se pudo cargar el local.'; return; }
  const prev = D && D.id === id ? new Map(D.comandas.map(c => [c.id, c.estado])) : null;
  D = { id, turno: (tur.data && tur.data[0]) || null, pedidos: ped.data || [], reservas: res.data || [], name: loc.data.nombre, adminPin: loc.data.admin_pin || '', mesas: loc.data.mesas, mesas2: loc.data.mesas2 || 0,
    garzones: (gar.data || []).map(r => ({ id: r.id, n: r.nombre, on: r.activo, pin: r.pin || '' })),
    menu: (menu.data || []).map(r => ({ id: r.id, n: r.nombre, c: r.categoria, p: r.precio, on: r.activo, e: r.estacion === 'cafeteria' ? 'cafeteria' : 'cocina', s: r.stock == null ? null : r.stock, sm: r.stock_min || 0 })),
    comandas: (com.data || []).map(r => ({ id: r.id, mesa: r.mesa, items: r.items, est: (r.items && r.items[0] && r.items[0].e === 'cafeteria') ? 'cafeteria' : 'cocina', note: r.nota || '', estado: r.estado, garzon: r.garzon || '', t: +new Date(r.created_at), cerrada: r.cerrada })),
    cuentas: (cue.data || []).map(r => ({ id: r.id, mesa: r.mesa, total: r.total, propina: r.propina, pe: r.propina_efec || 0, pt: r.propina_tarj || 0, metodo: r.metodo, garzon: r.garzon || '', items: r.items, t: +new Date(r.created_at) })) };
  if (prev) avisar(prev);
}
let rt = null, tmr = null;
function suscribir() {
  if (rt || !D) return;
  const refresca = () => { clearTimeout(tmr); tmr = setTimeout(async () => { if (!S.user) return; await cargar(); render(); }, 300); };
  rt = sb.channel('resto-' + D.id);
  ['resto_comandas', 'resto_menu', 'resto_locales', 'resto_cuentas', 'resto_turnos', 'resto_pedidos', 'resto_reservas'].forEach(t => rt.on('postgres_changes', { event: '*', schema: 'public', table: t }, refresca));
  rt.subscribe();
}
const _h = location.hash || '';
if (/type=(invite|recovery)/.test(_h)) S.setpass = true;
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { S.setpass = true; render(); } });
async function inicio() {
  const { data } = await sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  if (S.user && !S.setpass) { await cargar(); suscribir(); }
  S.loading = false; render(); pantalla();
}

/* ---------- Vistas ---------- */
function loginHTML() {
  if (S.loading) return `<div class="login"><div class="card"><div class="mut">Cargando…</div></div></div>`;
  if (S.setpass) return `<div class="login"><div class="card">
    <div><b style="font-size:1.4rem">PROTECH <span style="color:#0284c7">RESTO</span></b><div class="mut">Crea tu clave para entrar</div></div>
    <label class="mut">Clave nueva (mínimo 8 caracteres)<input id="np1" type="password" autocomplete="new-password"></label>
    <label class="mut">Repite la clave<input id="np2" type="password" autocomplete="new-password"></label>
    ${S.err ? `<div style="color:var(--bad);font-size:.9rem">${esc(S.err)}</div>` : ''}
    <button class="btn" data-act="guardarclave" ${S.busy ? 'disabled' : ''}>Guardar clave y entrar</button></div></div>`;
  if (S.olvide) return `<div class="login"><div class="card">
    <div><b style="font-size:1.4rem">PROTECH <span style="color:#0284c7">RESTO</span></b><div class="mut">Crear o recuperar mi clave</div></div>
    <label class="mut">Correo del local<input id="rmail" type="email" autocomplete="username" placeholder="local@correo.cl"></label>
    ${S.err ? `<div style="color:var(--bad);font-size:.9rem">${esc(S.err)}</div>` : ''}
    ${S.ok ? `<div style="color:var(--ok);font-size:.9rem">${esc(S.ok)}</div>` : ''}
    <button class="btn" data-act="enviarlink" ${S.busy ? 'disabled' : ''}>Enviarme un enlace al correo</button>
    <button class="btn-line" data-act="volverlogin">Volver</button></div></div>`;
  return `<div class="login"><div class="card">
    <div><b style="font-size:1.4rem">PROTECH <span style="color:#0284c7">RESTO</span></b><div class="mut">Pedidos y comandas para restaurantes y cafeterías</div></div>
    <label class="mut">Correo del local<input id="lmail" type="email" autocomplete="username" placeholder="local@correo.cl"></label>
    <label class="mut">Clave<input id="lpass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    ${S.err ? `<div style="color:var(--bad);font-size:.9rem">${esc(S.err)}</div>` : ''}
    <button class="btn" data-act="login" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Entrando…' : 'Entrar'}</button>
    <button class="btn-line" data-act="olvide">Primera vez o olvidé mi clave</button>
    <div class="hint">¿No tienes cuenta? Pídela a Protech: <a href="https://wa.me/56939473588" target="_blank" rel="noopener">WhatsApp +56 9 3947 3588</a>. Cada local ve solo sus propios datos.</div>
  </div></div>`;
}
function shell(inner) {
  const todas = [['mesas', 'Mesas'], ['cocina', 'Cocina'], ['cafe', 'Cafetería'], ['resv', 'Reservas'], ['turno', 'Caja'], ['caja', 'Ventas'], ['inv', 'Inventario' + (bajoStock().length ? ' ⚠' + bajoStock().length : '')], ['garz', 'Garzones'], ['carta', 'Carta y mesas']];
  const tabs = todas.filter(t => misTabs().includes(t[0]));

document.addEventListener('input', e => {

  if (e.target.id === 'pefec') S.pe = e.target.value;

    const t = $('#totpagar');

  }
  if (e.target.id === 'a-nombre') S.af.nombre = e.target.value;

  if (e.target.id === 'a-email') S.af.email = e.target.value;
});
document.addEventListener('change', e => {

});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'lpass' || e.target.id === 'lmail')) document.querySelector('[data-act=login]').click(); });
const fallo = r => { if (r && r.error) { S.err = 'Error: ' + r.error.message; alert('No se pudo guardar: ' + r.error.message); return true; } return false; };

document.addEventListener('click', async e => {

  if (S.busy) return;
  const a = b.dataset.act, d = b.dataset;

      S.busy = true; S.err = ''; render();

      if (error) { S.busy = false; S.err = 'Correo o clave incorrectos'; render(); return; }

    }

      try { localStorage.setItem('pr-snd', SND); } catch (x) {}
      if (SND === 'cocina' || SND === 'ambos') sonarCocina(); else if (SND === 'salon') sonarListo();

    }
    if (a === 'olvide') { S.olvide = true; S.err = ''; S.ok = ''; render(); return; }

      S.busy = true; S.err = ''; render();

      S.busy = false; S.ok = 'Si el correo está registrado, te enviamos un enlace. Revisa tu bandeja (y spam).'; render(); return;
    }

    if (a === 'tab') { S.view = d.v; S.mesa = null; if (d.v === 'garz') S.rp = null; if (d.v === 'turno') S.th = null; }
    else if (a === 'mesa') { S.mesa = +d.n; S.cart = {}; S.note = ''; S.cerrando = false; S.parcial = false; S.sel = {}; S.pe = ''; S.pt = ''; }
