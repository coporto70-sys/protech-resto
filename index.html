<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Protech Resto · Pedidos y comandas</title>
<meta name="theme-color" content="#0284c7">
<style>
:root{--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--brand:#0284c7;--brand-d:#0369a1;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
input,select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(2,132,199,.15)}
.btn{background:var(--brand);color:#fff}.btn:hover{background:var(--brand-d)}
.btn-ok{background:var(--ok);color:#fff}.btn-bad{background:#fee2e2;color:var(--bad)}.btn-line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled,.btn-ok:disabled{opacity:.45;cursor:not-allowed}
header{background:#0b1a2b;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header b{font-size:1.05rem}header small{color:#93c5fd;display:block;font-size:.75rem}
nav{display:flex;gap:6px;flex:1;overflow-x:auto}
nav button{background:transparent;color:#cbd5e1;padding:8px 12px}
nav button.on{background:var(--brand);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:1.25rem;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mesa{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center}
.mesa b{display:block;font-size:1.5rem}.mesa span{font-size:.8rem;color:var(--mut)}
.mesa.ocu{border-color:var(--warn);background:#fffbeb}.mesa.lis{border-color:var(--ok);background:#f0fdf4}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.cols{display:grid;gap:16px;grid-template-columns:1fr 340px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.q{display:flex;align-items:center;gap:8px}.q button{width:34px;height:34px;padding:0;background:var(--line)}.q span{min-width:20px;text-align:center;font-weight:700}
.piso{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:18px 0 8px;font-weight:700}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:14px 0 4px;font-weight:700}
.kan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.col h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.tk{background:#fff;border-left:5px solid var(--warn);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.tk.p2{border-color:var(--brand)}.tk.p3{border-color:var(--ok)}
.tk h4{display:flex;justify-content:space-between}.tk ul{margin:8px 0 10px 18px;font-size:.95rem}
.tk em{display:block;color:var(--bad);font-size:.85rem;margin-bottom:8px}
.pill{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut);font-weight:700}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding-top:10px}
.mut{color:var(--mut);font-size:.9rem}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{display:grid;gap:12px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
.stat b{display:block;font-size:1.6rem}
.dnrow{display:grid;grid-template-columns:1fr 110px 84px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dnrow b{text-align:right}.dnrow input{text-align:right}
.cols2{display:grid;gap:16px;grid-template-columns:320px 1fr}
.pos{--pc:#4f46e5;--pc2:#7c3aed;display:grid;gap:20px;grid-template-columns:1fr 360px;align-items:start;margin-bottom:16px}
.pos-bar{display:flex;gap:12px;flex-wrap:wrap}
.pos-bar input{margin:0}
.pos-bus{flex:1;min-width:200px;padding:14px 16px!important;border-radius:16px!important;background:#fff;border:1.5px solid var(--line)!important}
.pos-scan{flex:0 1 240px;min-width:190px;padding:14px 16px!important;border-radius:16px!important;border:none!important;color:#fff!important;font-weight:700;background:linear-gradient(135deg,var(--pc),var(--pc2))!important;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.pos-scan::placeholder{color:#fff;opacity:.95}
.pos-sub{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 2px 10px;font-size:.85rem;color:var(--mut)}
.pos-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pos-it{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;min-height:150px;transition:.15s}
.pos-it:hover{border-color:var(--pc);box-shadow:0 6px 18px rgba(79,70,229,.15);transform:translateY(-1px)}
.pos-it.off{opacity:.5;cursor:not-allowed;filter:grayscale(1)}
.pos-ico{width:48px;height:48px;border-radius:14px;background:#f8fafc;display:grid;place-items:center;font-size:1.6rem}
.pos-nm{font-weight:700;font-size:.95rem;line-height:1.2;flex:1}
.pos-cb{font:.7rem ui-monospace,monospace;color:#94a3b8;min-height:1em}
.pos-pr{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pos-pr b{color:var(--pc);font-size:1.1rem}
.pos-st{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:#dcfce7;color:#15803d;white-space:nowrap}
.pos-st.low{background:#fef3c7;color:#b45309}.pos-st.out{background:#e2e8f0;color:#64748b}
.pos-q{position:absolute;top:8px;right:8px;background:var(--pc);color:#fff;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:.85rem;padding:0 6px}
.pos-cart{background:#fff;border-radius:22px;box-shadow:0 4px 18px rgba(15,23,42,.08);position:sticky;top:8px;overflow:hidden}
.pos-ch{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.pos-ch b{font-size:1.1rem}.pos-ch small{display:block;color:var(--mut)}
.pos-vac{all:unset;cursor:pointer;color:#fb7185;font-weight:700;font-size:.9rem}
.pos-empty{text-align:center;padding:34px 20px;color:var(--mut)}.pos-empty .e{font-size:3rem}.pos-empty b{display:block;color:#475569;margin:8px 0 2px}
.pos-line{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid #f1f5f9}
.pos-line>span{flex:1}
.pos-body{padding:14px 20px 20px;border-top:1px solid var(--line)}
.pos-tot{display:flex;justify-content:space-between;color:var(--mut);padding:3px 0}
.pos-big{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;padding:8px 0}.pos-big span:last-child{font-size:2rem}
.pos-cobrar{width:100%;padding:16px!important;border-radius:16px!important;font-size:1.05rem;font-weight:800;color:#fff!important;background:linear-gradient(135deg,var(--pc),var(--pc2))!important;border:none}
.pos-cobrar:disabled{background:#cbd5e1!important;color:#fff!important;cursor:not-allowed}
@media(max-width:900px){.pos{grid-template-columns:1fr}.pos-cart{position:static}.pos-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
@media(max-width:820px){.cols2{grid-template-columns:1fr}}
table{border-collapse:collapse}
.hint{font-size:.8rem;color:var(--mut);background:#f8fafc;border-radius:10px;padding:10px}
.off{opacity:.45}
#toast{position:fixed;left:12px;right:12px;top:64px;z-index:50;display:grid;gap:8px;pointer-events:none}
#toast div{pointer-events:auto;padding:14px 16px;border-radius:12px;color:#fff;font-weight:800;font-size:1.1rem;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pulso .8s ease-in-out 6}
#toast .tk-c{background:var(--bad)}#toast .tk-l{background:var(--ok)}
@keyframes pulso{50%{transform:scale(1.03);filter:brightness(1.25)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="soporte.js?v=1"></script>
<script>
/* =====================================================
   PROTECH RESTO — conectado a Supabase
   Cada local entra con su correo y clave (cuentas creadas por Protech)
   y solo ve sus propios datos (seguridad RLS en la base).
   ===================================================== */
const SB_URL = 'https://fchqqtdapyrgpkyxiful.supabase.co';
const SB_KEY = 'sb_publishable_7jjHrGLPJ51aP0BKwcIizg_bakLNqiY';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(n).toLocaleString('es-CL');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mins = t => Math.max(0, Math.round((Date.now() - t) / 60000));

let D = null; // datos del local: {id,name,mesas,menu,comandas,cuentas}
let S = { garzon: '', rp: null, rpd: null, rph: null, user: null, loading: true, view: 'mesas', mesa: null, cart: {}, note: '', cerrando: false, parcial: false, sel: {}, propina: true, metodo: 'Efectivo', err: '', ok: '', busy: false, setpass: false, olvide: false, admin: false, rol: null, quien: '', f: {}, np: null, th: null, mos: false, ses: null, back: null, qk: null, rc: '', pinErr: '', av: { locales: [], cargado: false, msg: '', err: '' }, af: { nombre: '', mesas: '6', email: '' } };
const L = () => D;
const extraCuenta = () => ({ ...(D.turno ? { turno_id: D.turno.id } : {}), ...(S.quien ? { cobrado_por: S.quien } : {}) });
/* ---------- Roles y PIN ----------
   Si el local tiene PIN de administradora, cada persona elige quién es y entra con su PIN.
   Administradora: todo. Garzón: solo Mesas (tomar pedidos y cobrar). Cocina: Cocina y Cafetería.
   Si el local aún no configuró PIN, funciona como siempre (todo visible). */
const rolesOn = () => !!(D && D.adminPin);
const esIng = () => S.rol === 'ingeniero';
const esAdm = () => !rolesOn() || S.rol === 'admin' || esIng();
const TABS = { admin: ['mesas', 'cocina', 'cafe', 'resv', 'turno', 'caja', 'inv', 'garz', 'coms', 'carta'], garzon: ['mesas'], cocina: ['cocina', 'cafe'] };
TABS.ingeniero = TABS.admin; /* Carlos Oporto (Ingeniero de Software): ve todos los paneles */
/* Cobrar en caja: la administradora autoriza a cada garzón (necesita PIN). Los demás toman pedidos pero no cobran. */
const cajaGarzon = () => { const g = D && D.garzones.find(x => x.n === S.quien && x.on); return !!(g && g.pin && g.cj); };
const puedeCobrar = () => !rolesOn() || S.rol === 'admin' || esIng() || (S.rol === 'garzon' && cajaGarzon());
/* Todos los garzones cobran sus mesas; la venta por mostrador y la pestaña Caja son solo para la administradora y los garzones autorizados con PIN */
const puedeCobrarMesa = () => !rolesOn() || S.rol === 'admin' || esIng() || S.rol === 'garzon';
/* Mesas propias: cada mesa es de quien la tomó. Un garzón no entra a la mesa de otro; solo quien tiene caja (PIN autorizado) puede abrirla para cobrarla. */
const duenoMesa = n => ((abiertas(n).find(c => c.garzon) || {}).garzon) || '';
const esGarzonRol = () => rolesOn() && S.rol === 'garzon';
const mesaPropia = n => { const d = duenoMesa(n); return !esGarzonRol() || !d || d === S.quien; };
const puedeVerMesa = n => mesaPropia(n) || cajaGarzon();
const puedeCobrarEsta = n => puedeCobrarMesa() && puedeVerMesa(n);
const misTabs = () => !rolesOn() ? TABS.admin : S.rol === 'garzon' && cajaGarzon() ? ['mesas', 'turno'] : (TABS[S.rol] || []);
async function hpin(scope, pin) {
  const b = new TextEncoder().encode(D.id + ':' + scope + ':' + pin);
  const h = await crypto.subtle.digest('SHA-256', b);
  return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function entrar(rol, quien) {
  S.rol = rol; S.quien = quien; S.qk = null; S.pinErr = ''; S.mesa = null;
  S.garzon = rol === 'garzon' ? quien : '';
  S.view = misTabs()[0];
  if (rol !== 'ingeniero') guardarRol(D.id, rol, quien); /* el ingeniero pide su clave cada vez */
  /* el dispositivo de la cocina queda abierto: si se recarga, vuelve solo a Cocina con la misma cocinera */
  try { if (rol === 'cocina') localStorage.setItem('pr-cocina', JSON.stringify({ lid: D.id, quien })); else localStorage.removeItem('pr-cocina'); } catch (e) {}
  S.ses = null; S.mos = false; ensureSes().then(render); pantalla();
}
/* Quién está usando este dispositivo se guarda en el propio equipo (no se pierde al recargar, cambiar de pestaña ni cuando el celular cierra la app).
   Se mantiene 16 h desde la última vez que se usó; "Cambiar" o "Salir" lo borran. */
const ROL_MS = 16 * 3600 * 1000;
function guardarRol(lid, rol, quien) { try { localStorage.setItem('pr-rol', JSON.stringify({ lid, rol, quien, t: Date.now() })); } catch (e) {} }
const olvidarRol = () => { try { sessionStorage.removeItem('pr-rol'); localStorage.removeItem('pr-rol'); localStorage.removeItem('pr-cocina'); } catch (e) {} };
const cocineraValida = q => D.cocineras.length ? D.cocineras.some(c => c.n === q && c.on) : q === 'Cocina';
function restaurarRol() {
  if (!rolesOn() || S.rol) return;
  try {
    let r = JSON.parse(localStorage.getItem('pr-rol') || 'null');
    if (r && r.rol !== 'cocina' && Date.now() - (r.t || 0) > ROL_MS) { localStorage.removeItem('pr-rol'); r = null; }
    if (!r) { const k = JSON.parse(localStorage.getItem('pr-cocina') || 'null'); if (k) r = { lid: k.lid, rol: 'cocina', quien: k.quien }; }
    if (r && r.lid === D.id && (r.rol === 'admin' || (r.rol === 'cocina' && cocineraValida(r.quien)) || (r.rol === 'garzon' && D.garzones.some(g => g.n === r.quien && g.on)))) { S.rol = r.rol; S.quien = r.quien; S.garzon = r.rol === 'garzon' ? r.quien : ''; S.view = misTabs()[0]; guardarRol(r.lid, r.rol, r.quien); ensureSes().then(() => {}); pantalla(); }
  } catch (e) {}
}
function quienHTML() {
  const g = D.garzones.filter(x => x.on), coc = D.cocineras.filter(x => x.on);
  const opt = (k, n, sub) => `<button class="mesa" style="width:100%" data-act="qsel" data-k="${esc(k)}"><b style="font-size:1.1rem">${esc(n)}</b><span>${sub}</span></button>`;
  let sel = '';
  if (S.qk) {
    const ing = S.qk === 'ing', nombre = ing ? 'Carlos Oporto' : S.qk === 'admin' ? 'Administradora' : S.qk.slice(2);
    sel = `<div class="card" style="margin-top:12px;display:grid;gap:10px"><b>${esc(nombre)}</b>
      <label class="mut">${ing ? 'Tu clave' : 'Tu PIN'}<input id="qpin" type="password" ${ing ? 'autocomplete="off" placeholder="Clave"' : 'inputmode="numeric" autocomplete="off" placeholder="••••"'} autofocus></label>
      ${S.pinErr ? `<div style="color:var(--bad);font-size:.9rem">${esc(S.pinErr)}</div>` : ''}
      <div style="display:flex;gap:8px"><button class="btn" style="flex:1" data-act="qok">Entrar</button><button class="btn-line" data-act="qback">Volver</button></div></div>`;
  }
  return `<header><div><b>${esc(D.name)}</b><small>Protech Resto</small></div><nav></nav><button class="btn-line" style="padding:6px 12px" data-act="logout">Salir</button></header>
  <main><h2>¿Quién eres?</h2><div class="grid">${opt('admin', 'Administradora', 'Todo el local')}${g.map(x => opt('g:' + x.n, x.n, 'Mesas y cobros')).join('')}${coc.length ? coc.map(x => opt('c:' + x.n, x.n, 'Cocina · comandas')).join('') : opt('cocina', 'Cocina', 'Comandas')}${opt('ing', 'Carlos Oporto', 'Ingeniero de Software')}</div>${sel}</main>`;
}

const abiertas = m => L().comandas.filter(c => !c.cerrada && c.mesa === m);
/* i.pg = unidades de ese producto que un cliente ya pagó por separado (cobro parcial) */
const totalMesa = m => abiertas(m).reduce((a, c) => a + c.items.reduce((s, i) => s + (i.q - (i.pg || 0)) * i.p, 0), 0);
const pagada = c => c.items.every(i => (i.pg || 0) >= i.q);
/* las mesas del piso 2 se guardan como 101, 102… (así no chocan con las del piso 1) */
const nm = m => {
  if (m === 0) return 'Venta mostrador';
  if (m >= 1000) { const p = (D && D.pedidos || []).find(x => x.num === m); return p ? (p.tipo === 'delivery' ? 'Delivery' : 'Para llevar') + ' #' + (m - 1000) + (p.cliente ? ' · ' + esc(p.cliente) : '') : 'Pedido #' + (m - 1000); }
  return m > 100 ? 'Piso 2 · Mesa ' + (m - 100) : 'Mesa ' + m;
};
const fv = k => esc(S.f[k] ?? '');
const pedDe = n => ((D && D.pedidos) || []).find(p => p.num === n);
const enPOS = () => S.mos && (S.view === 'mesas' || (S.view === 'turno' && !!D.turno));
const cajaAbierta = () => !rolesOn() || !!D.turno;
const hoyIso = () => fechaIso(new Date());
const resDe = n => ((D && D.reservas) || []).filter(r => r.mesa === n && r.estado === 'pendiente' && r.fecha === hoyIso()).sort((a, b) => a.hora.localeCompare(b.hora))[0];
const bajoStock = () => L().menu.filter(i => i.s != null && i.s <= i.sm);
const hoy = t => new Date(t).toDateString() === new Date().toDateString();

/* ---------- Sonidos y avisos ---------- */
const SNDL = { ambos: 'todo', cocina: 'solo cocina', salon: 'solo salón', off: 'apagado' };
const esCafe = c => c.est === 'cafeteria';
let SND = 'ambos'; try { SND = localStorage.getItem('pr-snd') || 'ambos'; } catch (e) {}
if (!SNDL[SND]) SND = 'ambos';
let AC = null;
function ctx() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch (e) { return null; } }
function tono(f, t0, dur, tipo, vol) {
  const c = ctx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.type = tipo; o.frequency.value = f; o.connect(g); g.connect(c.destination);
  const t = c.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function vibra(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function sonarCocina() { for (let i = 0; i < 3; i++) { tono(988, i * 0.75, 0.32, 'square', 0.9); tono(1319, i * 0.75 + 0.36, 0.32, 'square', 0.9); } vibra([300, 150, 300, 150, 300]); }
function sonarListo() { tono(784, 0, 0.35, 'sine', 0.8); tono(1047, 0.3, 0.35, 'sine', 0.8); tono(1319, 0.6, 0.7, 'sine', 0.8); vibra([200, 100, 200]); }
function toast(txt, cls) {
  const el = $('#toast'); if (!el) return;
  const d = document.createElement('div'); d.className = cls; d.innerHTML = esc(txt); el.appendChild(d);
  while (el.children.length > 4) el.removeChild(el.firstChild);
  setTimeout(() => { if (d.parentNode) d.remove(); }, 12000);
}
document.addEventListener('pointerdown', () => ctx());
document.addEventListener('click', e => { if (e.target.closest('#toast')) $('#toast').innerHTML = ''; });
/* Avisos: la administradora recibe TODO (comandas, listos, cafetería, pedidos, stock, reservas).
   Garzón: solo sus pedidos listos. Cocina: solo comandas nuevas. */
let EX = null;
function avisar(prev) {
  const rol = rolesOn() ? S.rol : 'admin', adm = rol === 'admin' || rol === 'ingeniero';
  const modo = adm ? (SND === 'off' ? 'off' : 'ambos') : SND;
  const por = c => nm(c.mesa) + (c.garzon ? ' (' + c.garzon + ')' : '');
  const nuevos = D.comandas.filter(c => !prev.has(c.id) && c.estado === 'pendiente' && !esCafe(c));
  const cafes = D.comandas.filter(c => !prev.has(c.id) && esCafe(c));

async function cmPagina(tabla, d, h) {
  let rows = [], err = false;
  for (let p = 0; p < 10; p++) {
    const r = await sb.from(tabla).select('*').eq('local_id', D.id).gte('created_at', d.toISOString()).lt('created_at', h.toISOString()).order('created_at', { ascending: false }).range(p * 1000, p * 1000 + 999);

function imprimirQR() {
  const l = L(), base = location.origin + location.pathname.replace(/[^/]*$/, '') + 'pedir.html?l=' + encodeURIComponent(l.id) + '&m=';
  const mesas = []; for (let n = 1; n <= l.mesas; n++) mesas.push(n); for (let k = 1; k <= (l.mesas2 || 0); k++) mesas.push(100 + k);
  const svg = m => { const q = qrcode(0, 'M'); q.addData(base + m); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); };
  const w = window.open('', '_blank'); if (!w) { alert('Permite las ventanas emergentes para imprimir los QR.'); return; }
  w.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>QR de mesas · ' + esc(l.name) + '</title><style>' +
    'body{font-family:system-ui,sans-serif;margin:0;padding:12px}h1{font-size:1rem;margin:0 0 10px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}' +
    '.t{border:2px solid #0f172a;border-radius:14px;padding:14px;text-align:center;break-inside:avoid}.t svg{width:100%;max-width:220px;height:auto}' +
    '.t b{display:block;font-size:1.5rem;margin-top:6px}.t span{display:block;font-size:.95rem;color:#475569;margin-top:2px}' +
    '@media print{h1{display:none}body{padding:0}}</style></head><body><h1>Imprime esta hoja (Ctrl+P) y recorta un QR por mesa.</h1><div class="g">' +
    mesas.map(m => '<div class="t">' + svg(m) + '<b>' + esc(nm(m)) + '</b><span>Escanea y pide desde tu mesa</span><span>' + esc(l.name) + '</span></div>').join('') + '</div></body></html>');
  w.document.close();
}

document.addEventListener('input', e => {
  if (e.target.dataset && 'keep' in e.target.dataset) S.f[e.target.id] = e.target.value;
  if (e.target.id === 'bus-mos') render();
  /* si el lector no manda Enter al final, el código se toma solo cuando termina de llegar */
  if (e.target.id === 'scan-mos') { clearTimeout(scanT); const el = e.target; scanT = setTimeout(() => { const v = el.value; if (S.mos && el.isConnected && v.trim().length >= 6) { el.value = ''; escanMostrador(v); } }, 250); }
  if (e.target.id === 'nota') S.note = e.target.value;
  if (/^(dn[ac]-\d+|ctarj|ctrans)$/.test(e.target.id)) dnActualiza();
  if (e.target.id === 'pefec') S.pe = e.target.value;
  if (e.target.id === 'recib') { S.rc = e.target.value; actualizaVuelto(); }
  if (e.target.id === 'ptarj') {
