<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Protech Resto · Pedidos y comandas</title>
<meta name="theme-color" content="#0284c7">
<style>
:root{--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--brand:#0284c7;--brand-d:#0369a1;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
input,select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(2,132,199,.15)}
.btn{background:var(--brand);color:#fff}.btn:hover{background:var(--brand-d)}
.btn-ok{background:var(--ok);color:#fff}.btn-bad{background:#fee2e2;color:var(--bad)}.btn-line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled,.btn-ok:disabled{opacity:.45;cursor:not-allowed}
header{background:#0b1a2b;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header b{font-size:1.05rem}header small{color:#93c5fd;display:block;font-size:.75rem}
nav{display:flex;gap:6px;flex:1;overflow-x:auto}
nav button{background:transparent;color:#cbd5e1;padding:8px 12px}
nav button.on{background:var(--brand);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:1.25rem;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mesa{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center}
.mesa b{display:block;font-size:1.5rem}.mesa span{font-size:.8rem;color:var(--mut)}
.mesa.ocu{border-color:var(--warn);background:#fffbeb}.mesa.lis{border-color:var(--ok);background:#f0fdf4}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.cols{display:grid;gap:16px;grid-template-columns:1fr 340px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.q{display:flex;align-items:center;gap:8px}.q button{width:34px;height:34px;padding:0;background:var(--line)}.q span{min-width:20px;text-align:center;font-weight:700}
.cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:14px 0 4px;font-weight:700}
.kan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.col h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.tk{background:#fff;border-left:5px solid var(--warn);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.tk.p2{border-color:var(--brand)}.tk.p3{border-color:var(--ok)}
.tk h4{display:flex;justify-content:space-between}.tk ul{margin:8px 0 10px 18px;font-size:.95rem}
.tk em{display:block;color:var(--bad);font-size:.85rem;margin-bottom:8px}
.pill{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut);font-weight:700}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding-top:10px}
.mut{color:var(--mut);font-size:.9rem}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{display:grid;gap:12px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px}
.stat b{display:block;font-size:1.6rem}
.hint{font-size:.8rem;color:var(--mut);background:#f8fafc;border-radius:10px;padding:10px}
.off{opacity:.45}
#toast{position:fixed;left:12px;right:12px;top:64px;z-index:50;display:grid;gap:8px;pointer-events:none}
#toast div{pointer-events:auto;padding:14px 16px;border-radius:12px;color:#fff;font-weight:800;font-size:1.1rem;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pulso .8s ease-in-out 6}
#toast .tk-c{background:var(--bad)}#toast .tk-l{background:var(--ok)}
@keyframes pulso{50%{transform:scale(1.03);filter:brightness(1.25)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =====================================================
   PROTECH RESTO — conectado a Supabase
   Cada local entra con su correo y clave (cuentas creadas por Protech)
   y solo ve sus propios datos (seguridad RLS en la base).
   ===================================================== */
const SB_URL = 'https://fchqqtdapyrgpkyxiful.supabase.co';
const SB_KEY = 'sb_publishable_7jjHrGLPJ51aP0BKwcIizg_bakLNqiY';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(n).toLocaleString('es-CL');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mins = t => Math.max(0, Math.round((Date.now() - t) / 60000));

let D = null; // datos del local: {id,name,mesas,menu,comandas,cuentas}
let S = { user: null, loading: true, view: 'mesas', mesa: null, cart: {}, note: '', cerrando: false, propina: true, metodo: 'Efectivo', err: '', ok: '', busy: false, setpass: false, olvide: false, admin: false, av: { locales: [], cargado: false, msg: '', err: '' }, af: { nombre: '', mesas: '6', email: '' } };
const L = () => D;

const abiertas = m => L().comandas.filter(c => !c.cerrada && c.mesa === m);
const totalMesa = m => abiertas(m).reduce((a, c) => a + c.items.reduce((s, i) => s + i.q * i.p, 0), 0);
const hoy = t => new Date(t).toDateString() === new Date().toDateString();

/* ---------- Sonidos y avisos ---------- */
const SNDL = { ambos: 'cocina y salón', cocina: 'solo cocina', salon: 'solo salón', off: 'apagado' };
let SND = 'ambos'; try { SND = localStorage.getItem('pr-snd') || 'ambos'; } catch (e) {}
let AC = null;
function ctx() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch (e) { return null; } }
function tono(f, t0, dur, tipo, vol) {
  const c = ctx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.type = tipo; o.frequency.value = f; o.connect(g); g.connect(c.destination);
  const t = c.currentTime + t0; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function vibra(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function sonarCocina() { for (let i = 0; i < 3; i++) { tono(988, i * 0.75, 0.32, 'square', 0.9); tono(1319, i * 0.75 + 0.36, 0.32, 'square', 0.9); } vibra([300, 150, 300, 150, 300]); }
function sonarListo() { tono(784, 0, 0.35, 'sine', 0.8); tono(1047, 0.3, 0.35, 'sine', 0.8); tono(1319, 0.6, 0.7, 'sine', 0.8); vibra([200, 100, 200]); }
let toastT = null;
function toast(txt, cls) {
  const el = $('#toast'); if (!el) return;
  el.innerHTML = `<div class="${cls}">${esc(txt)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => { el.innerHTML = ''; }, 12000);
}
document.addEventListener('pointerdown', () => ctx());
document.addEventListener('click', e => { if (e.target.closest('#toast')) $('#toast').innerHTML = ''; });
function avisar(prev) {
  const nuevos = D.comandas.filter(c => !prev.has(c.id) && c.estado === 'pendiente');
  const listos = D.comandas.filter(c => c.estado === 'listo' && prev.get(c.id) !== 'listo');
  if (nuevos.length && (SND === 'cocina' || SND === 'ambos')) { sonarCocina(); toast('NUEVA COMANDA · Mesa ' + nuevos.map(c => c.mesa).join(', '), 'tk-c'); }
  if (listos.length && (SND === 'salon' || SND === 'ambos')) { sonarListo(); toast('PEDIDO LISTO · Mesa ' + listos.map(c => c.mesa).join(', '), 'tk-l'); }
}
let WL = null;
async function pantalla() { try { if (SND !== 'off' && 'wakeLock' in navigator && !WL && !document.hidden) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => { WL = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) pantalla(); });

async function llamarAdmin(body) {
  const { data } = await sb.auth.getSession();
  const r = await fetch(SB_URL + '/functions/v1/admin-resto', { method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + (data.session ? data.session.access_token : '') },
    body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || j.message || ('Error ' + r.status));
  return j;
}
async function adminCargar() {
  try { const j = await llamarAdmin({ action: 'list' }); S.av.locales = j.locales; S.av.err = ''; S.av.cargado = true; }
  catch (e) { S.av.err = e.message; S.av.cargado = true; }
  render();
}
async function cargar() {
  S.admin = !!(S.user && S.user.app_metadata && S.user.app_metadata.role === 'protech_admin');
  if (S.admin && !S.av.cargado) adminCargar();
  const { data: mi } = await sb.from('resto_miembros').select('local_id').maybeSingle();
  if (!mi && S.admin) { D = null; S.view = 'admin'; return; }
  if (!mi) { S.err = 'Tu cuenta aún no tiene un local asignado. Avisa a Protech.'; await sb.auth.signOut(); S.user = null; D = null; return; }
  const id = mi.local_id, desde = new Date(); desde.setHours(0, 0, 0, 0);
  const [loc, menu, com, cue] = await Promise.all([
    sb.from('resto_locales').select('*').eq('id', id).single(),
    sb.from('resto_menu').select('*').eq('local_id', id).order('categoria').order('nombre'),
    sb.from('resto_comandas').select('*').eq('local_id', id).eq('cerrada', false),
    sb.from('resto_cuentas').select('*').eq('local_id', id).gte('created_at', desde.toISOString())
  ]);
  if (loc.error) { S.err = 'No se pudo cargar el local.'; return; }
  const prev = D && D.id === id ? new Map(D.comandas.map(c => [c.id, c.estado])) : null;
  D = { id, name: loc.data.nombre, mesas: loc.data.mesas,
    menu: (menu.data || []).map(r => ({ id: r.id, n: r.nombre, c: r.categoria, p: r.precio, on: r.activo })),
    comandas: (com.data || []).map(r => ({ id: r.id, mesa: r.mesa, items: r.items, note: r.nota || '', estado: r.estado, t: +new Date(r.created_at), cerrada: r.cerrada })),
    cuentas: (cue.data || []).map(r => ({ id: r.id, mesa: r.mesa, total: r.total, propina: r.propina, metodo: r.metodo, items: r.items, t: +new Date(r.created_at) })) };
  if (prev) avisar(prev);
}
let rt = null, tmr = null;
function suscribir() {
  if (rt || !D) return;
  const refresca = () => { clearTimeout(tmr); tmr = setTimeout(async () => { if (!S.user) return; await cargar(); render(); }, 300); };
  rt = sb.channel('resto-' + D.id);
  ['resto_comandas', 'resto_menu', 'resto_locales', 'resto_cuentas'].forEach(t => rt.on('postgres_changes', { event: '*', schema: 'public', table: t }, refresca));
  rt.subscribe();
}
const _h = location.hash || '';
if (/type=(invite|recovery)/.test(_h)) S.setpass = true;
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { S.setpass = true; render(); } });
async function inicio() {
  const { data } = await sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  if (S.user && !S.setpass) { await cargar(); suscribir(); }
  S.loading = false; render(); pantalla();
}

/* ---------- Vistas ---------- */
function loginHTML() {
  if (S.loading) return `<div class="login"><div class="card"><div class="mut">Cargando…</div></div></div>`;
  if (S.setpass) return `<div class="login"><div class="card">
    <div><b style="font-size:1.4rem">PROTECH <span style="color:#0284c7">RESTO</span></b><div class="mut">Crea tu clave para entrar</div></div>
    <label class="mut">Clave nueva (mínimo 8 caracteres)<input id="np1" type="password" autocomplete="new-password"></label>
    <label class="mut">Repite la clave<input id="np2" type="password" autocomplete="new-password"></label>
    ${S.err ? `<div style="color:var(--bad);font-size:.9rem">${esc(S.err)}</div>` : ''}
    <button class="btn" data-act="guardarclave" ${S.busy ? 'disabled' : ''}>Guardar clave y entrar</button></div></div>`;
  if (S.olvide) return `<div class="login"><div class="card">
    <div><b style="font-size:1.4rem">PROTECH <span style="color:#0284c7">RESTO</span></b><div class="mut">Crear o recuperar mi clave</div></div>
    <label class="mut">Correo del local<input id="rmail" type="email" autocomplete="username" placeholder="local@correo.cl"></label>
    ${S.err ? `<div style="color:var(--bad);font-size:.9rem">${esc(S.err)}</div>` : ''}
    ${S.ok ? `<div style="color:var(--ok);font-size:.9rem">${esc(S.ok)}</div>` : ''}
    <button class="btn" data-act="enviarlink" ${S.busy ? 'disabled' : ''}>Enviarme un enlace al correo</button>
    <button class="btn-line" data-act="volverlogin">Volver</button></div></div>`;
  return `<div class="login"><div class="card">
    <div><b style="font-size:1.4rem">PROTECH <span style="color:#0284c7">RESTO</span></b><div class="mut">Pedidos y comandas para restaurantes y cafeterías</div></div>
    <label class="mut">Correo del local<input id="lmail" type="email" autocomplete="username" placeholder="local@correo.cl"></label>
    <label class="mut">Clave<input id="lpass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    ${S.err ? `<div style="color:var(--bad);font-size:.9rem">${esc(S.err)}</div>` : ''}
    <button class="btn" data-act="login" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Entrando…' : 'Entrar'}</button>
    <button class="btn-line" data-act="olvide">Primera vez o olvidé mi clave</button>
    <div class="hint">¿No tienes cuenta? Pídela a Protech: <a href="https://wa.me/56939473588" target="_blank" rel="noopener">WhatsApp +56 9 3947 3588</a>. Cada local ve solo sus propios datos.</div>
  </div></div>`;
}
function shell(inner) {
  const tabs = [['mesas', 'Mesas'], ['cocina', 'Cocina'], ['caja', 'Ventas'], ['carta', 'Carta y mesas']];
  if (S.admin) tabs.push(['admin', 'Admin Protech']);
  return `<header><div><b>${esc(L().name)}</b><small>Protech Resto</small></div>
    <nav>${tabs.map(([k, n]) => `<button class="${S.view === k ? 'on' : ''}" data-act="tab" data-v="${k}">${n}</button>`).join('')}</nav>
    <button class="btn-line" style="padding:6px 12px" data-act="sonido">Sonido: ${SNDL[SND]}${SND !== 'off' && !(AC && AC.state === 'running') ? ' (toca para activar)' : ''}</button>
    <button class="btn-line" style="padding:6px 12px" data-act="logout">Salir</button></header><main>${inner}</main>`;
}
function mesasHTML() {
  if (S.mesa !== null) return mesaDetalle();
  const l = L(); let g = '';
  const listos = l.comandas.filter(c => !c.cerrada && c.estado === 'listo');
  const avisoListos = listos.length ? `<div class="card" style="margin-bottom:12px;border:2px solid var(--ok)"><b>Listos para llevar a la mesa</b>${listos.map(c => `<div class="row"><div><b>Mesa ${c.mesa}</b> · ${c.items.map(i => i.q + '× ' + esc(i.n)).join(', ')}</div><button class="btn-ok" data-act="avanzar" data-id="${c.id}" data-to="entregado">Entregado en mesa</button></div>`).join('')}</div>` : '';
  for (let n = 1; n <= l.mesas; n++) {
    const a = abiertas(n); const lis = a.some(c => c.estado === 'listo');
    g += `<button class="mesa ${lis ? 'lis' : a.length ? 'ocu' : ''}" data-act="mesa" data-n="${n}"><b>${n}</b>
      <span>${lis ? 'Pedido listo' : a.length ? 'Ocupada · ' + money(totalMesa(n)) : 'Libre'}</span></button>`;
  }
  return `<h2>Mesas</h2>${avisoListos}<div class="grid">${g}</div><p class="mut" style="margin-top:14px">Toca una mesa para tomar un pedido. Verde = pedido listo para llevar.</p>`;
}
function mesaDetalle() {
  const l = L(), n = S.mesa;
  const cats = [...new Set(l.menu.filter(i => i.on).map(i => i.c))];
  const carta = cats.map(c => `<div class="cat">${esc(c)}</div>` + l.menu.filter(i => i.on && i.c === c).map(i => `
    <div class="row"><div>${esc(i.n)}<div class="mut">${money(i.p)}</div></div>
    <div class="q"><button data-act="dec" data-id="${i.id}">−</button><span>${S.cart[i.id] || 0}</span><button data-act="inc" data-id="${i.id}">+</button></div></div>`).join('')).join('');
  const sel = l.menu.filter(i => S.cart[i.id]);
  const subt = sel.reduce((a, i) => a + i.p * S.cart[i.id], 0);
  const ab = abiertas(n), tot = totalMesa(n);
  const env = ab.map(c => `<div class="row"><div><span class="pill">${c.estado}</span> ${c.items.map(i => i.q + '× ' + esc(i.n)).join(', ')}</div>${c.estado === 'listo' ? `<button class="btn-ok" data-act="avanzar" data-id="${c.id}" data-to="entregado">Entregado</button>` : ''}</div>`).join('');
  const prop = S.propina ? Math.round(tot * 0.1) : 0;
  const cierre = S.cerrando ? `<div class="card" style="margin-top:12px"><b>Cerrar cuenta · Mesa ${n}</b>
    <div class="row"><span>Consumo</span><b>${money(tot)}</b></div>
    <label class="row" style="cursor:pointer"><span>Propina sugerida 10%</span><input type="checkbox" style="width:auto" data-act="propina" ${S.propina ? 'checked' : ''}></label>
    <div class="total"><span>Total a pagar</span><span>${money(tot + prop)}</span></div>
    <label class="mut">Forma de pago<select id="metodo"><option ${S.metodo === 'Efectivo' ? 'selected' : ''}>Efectivo</option><option ${S.metodo === 'Tarjeta' ? 'selected' : ''}>Tarjeta</option><option ${S.metodo === 'Transferencia' ? 'selected' : ''}>Transferencia</option></select></label>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn-ok" data-act="pagar">Confirmar pago</button><button class="btn-line" data-act="nocerrar">Volver</button></div></div>` : '';
  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><button class="btn-line" data-act="volver">← Mesas</button><h2 style="margin:0">Mesa ${n}</h2></div>
  <div class="cols"><div class="card"><b>Carta</b>${carta || '<p class="mut">La carta está vacía. Agrega platos en "Carta y mesas".</p>'}</div>
  <div><div class="card"><b>Nuevo pedido</b>
    ${sel.map(i => `<div class="row"><span>${S.cart[i.id]}× ${esc(i.n)}</span><b>${money(i.p * S.cart[i.id])}</b></div>`).join('') || '<p class="mut" style="margin:8px 0">Agrega platos desde la carta.</p>'}
    <input id="nota" placeholder="Nota para cocina (sin cebolla, etc.)" value="${esc(S.note)}" style="margin-top:8px">
    <div class="total"><span>Subtotal</span><span>${money(subt)}</span></div>
    <button class="btn" style="width:100%;margin-top:8px" data-act="enviar" ${sel.length ? '' : 'disabled'}>Enviar a cocina</button></div>
  <div class="card" style="margin-top:12px"><b>Pedidos de la mesa</b>${env || '<p class="mut" style="margin:8px 0">Sin pedidos enviados.</p>'}
    <div class="total"><span>Cuenta</span><span>${money(tot)}</span></div>
    <button class="btn-ok" style="width:100%;margin-top:8px" data-act="cerrar" ${ab.length ? '' : 'disabled'}>Cerrar cuenta</button></div>${cierre}</div></div>`;
}
function cocinaHTML() {
  const cs = L().comandas.filter(c => !c.cerrada && c.estado !== 'entregado').sort((a, b) => a.t - b.t);
  const col = (est, titulo, cls, btn, next) => `<div class="col"><h3>${titulo} (${cs.filter(c => c.estado === est).length})</h3>` +
    (cs.filter(c => c.estado === est).map(c => `<div class="tk ${cls}"><h4><span>Mesa ${c.mesa}</span><span class="pill">${mins(c.t)} min</span></h4>
      <ul>${c.items.map(i => `<li>${i.q}× ${esc(i.n)}</li>`).join('')}</ul>${c.note ? `<em>Nota: ${esc(c.note)}</em>` : ''}
      <button class="btn" style="width:100%" data-act="avanzar" data-id="${c.id}" data-to="${next}">${btn}</button></div>`).join('') || '<p class="mut">Sin comandas</p>') + '</div>';
  return `<h2>Cocina</h2><div class="kan">${col('pendiente', 'Pendientes', '', 'Empezar a preparar', 'preparando')}${col('preparando', 'Preparando', 'p2', 'Marcar listo', 'listo')}${col('listo', 'Listos para servir', 'p3', 'Entregado en mesa', 'entregado')}</div>`;
}
function cajaHTML() {
  const cu = L().cuentas.filter(c => hoy(c.t)); const sum = k => cu.reduce((a, c) => a + c[k], 0);
  const por = {}; cu.forEach(c => por[c.metodo] = (por[c.metodo] || 0) + c.total + c.propina);
  const pop = {}; cu.forEach(c => c.items.forEach(i => pop[i.n] = (pop[i.n] || 0) + i.q));
  const top = Object.entries(pop).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `<h2>Ventas de hoy</h2><div class="stats">
    <div class="card stat"><span class="mut">Ventas</span><b>${money(sum('total'))}</b></div>
    <div class="card stat"><span class="mut">Propinas</span><b>${money(sum('propina'))}</b></div>
    <div class="card stat"><span class="mut">Cuentas cerradas</span><b>${cu.length}</b></div>
    <div class="card stat"><span class="mut">Ticket promedio</span><b>${money(cu.length ? sum('total') / cu.length : 0)}</b></div></div>
  <div class="cols"><div class="card"><b>Por forma de pago</b>${Object.entries(por).map(([k, v]) => `<div class="row"><span>${k}</span><b>${money(v)}</b></div>`).join('') || '<p class="mut" style="margin-top:8px">Aún no hay ventas hoy.</p>'}</div>
  <div class="card"><b>Más vendidos</b>${top.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${v}</b></div>`).join('') || '<p class="mut" style="margin-top:8px">Sin datos.</p>'}</div></div>
  <p class="mut" style="margin-top:12px">Este sistema no emite boletas ni facturas; solo controla pedidos, cuentas y ventas internas.</p>`;
}
function cartaHTML() {
  const l = L();
  return `<h2>Carta y mesas</h2><div class="cols"><div class="card"><b>Platos</b>
    ${l.menu.map(i => `<div class="row ${i.on ? '' : 'off'}"><div>${esc(i.n)}<div class="mut">${esc(i.c)} · ${money(i.p)}</div></div>
      <div style="display:flex;gap:6px"><button class="btn-line" data-act="toggle" data-id="${i.id}">${i.on ? 'Disponible' : 'Agotado'}</button><button class="btn-bad" data-act="del" data-id="${i.id}">Quitar</button></div></div>`).join('') || '<p class="mut">Sin platos.</p>'}</div>
  <div><div class="card" style="display:grid;gap:8px"><b>Agregar plato</b>
    <input id="an" placeholder="Nombre"><input id="ac" placeholder="Categoría (Café, Platos…)" list="cl"><datalist id="cl">${[...new Set(l.menu.map(i => i.c))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <input id="ap" type="number" inputmode="numeric" placeholder="Precio"><button class="btn" data-act="add">Agregar</button></div>
  <div class="card" style="margin-top:12px;display:grid;gap:8px"><b>Cantidad de mesas</b><input id="nm" type="number" min="1" max="60" value="${l.mesas}"><button class="btn-line" data-act="mesas">Guardar</button></div></div></div>`;
}
function adminShell() {
  return `<header><div><b>Admin Protech</b><small>Protech Resto</small></div><nav></nav>
    <button class="btn-line" style="padding:6px 12px" data-act="logout">Salir</button></header><main>${adminHTML()}</main>`;
}
function adminHTML() {
  const v = S.av, f = S.af;
  const lista = v.locales.map(l => `<div class="card" style="margin-bottom:12px"><div class="row" style="padding-top:0"><div><b>${esc(l.nombre)}</b><div class="mut">${l.mesas} mesas</div></div></div>
    ${l.usuarios.map(u => `<div class="row"><div>${esc(u.email)} <span class="pill">${u.confirmado ? 'Activo' : 'Invitación pendiente'}</span></div>
      ${u.confirmado ? '' : `<button class="btn-line" data-act="a_reenviar" data-email="${esc(u.email)}">Reenviar</button>`}</div>`).join('') || '<p class="mut">Sin usuarios.</p>'}
    <div style="display:flex;gap:8px;margin-top:10px"><input id="ae-${l.id}" type="email" placeholder="Agregar otro correo a este local"><button class="btn" style="white-space:nowrap" data-act="a_add" data-lid="${l.id}">Invitar</button></div></div>`).join('');
  return `<h2>Admin Protech · Locales y usuarios</h2>
    ${v.msg ? `<div class="card" style="margin-bottom:12px;color:var(--ok)">${esc(v.msg)}</div>` : ''}
    ${v.err ? `<div class="card" style="margin-bottom:12px;color:var(--bad)">${esc(v.err)}</div>` : ''}
    <div class="card" style="display:grid;gap:8px;margin-bottom:16px"><b>Nuevo local</b>
      <input id="a-nombre" placeholder="Nombre del local (ej. Café Central)" value="${esc(f.nombre)}">
      <input id="a-mesas" type="number" min="1" max="60" placeholder="Cantidad de mesas" value="${esc(f.mesas)}">
      <input id="a-email" type="email" placeholder="Correo del dueño (recibirá la invitación)" value="${esc(f.email)}">
      <button class="btn" data-act="a_crear" ${S.busy ? 'disabled' : ''}>Crear local e invitar por correo</button>
      <div class="hint">El dueño recibe un correo desde Protech con un enlace para crear su clave. Si el correo ya tiene cuenta (por ejemplo del POS), solo se asigna al local.</div></div>
    ${v.cargado ? lista || '<p class="mut">Aún no hay locales.</p>' : '<p class="mut">Cargando locales…</p>'}`;
}
function render() {
  const app = $('#app');
  if (S.setpass || !S.user) { app.innerHTML = loginHTML(); return; }
  if (!D) { app.innerHTML = S.admin ? adminShell() : loginHTML(); return; }
  const v = { mesas: mesasHTML, cocina: cocinaHTML, caja: cajaHTML, carta: cartaHTML, admin: adminHTML }[S.view];
  app.innerHTML = shell(v());
}

/* ---------- Acciones ---------- */
document.addEventListener('input', e => {
  if (e.target.id === 'nota') S.note = e.target.value;
  if (e.target.id === 'a-nombre') S.af.nombre = e.target.value;
  if (e.target.id === 'a-mesas') S.af.mesas = e.target.value;
  if (e.target.id === 'a-email') S.af.email = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'metodo') S.metodo = e.target.value;
  if (e.target.dataset && e.target.dataset.act === 'propina') { S.propina = e.target.checked; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'lpass' || e.target.id === 'lmail')) document.querySelector('[data-act=login]').click(); });
const fallo = r => { if (r && r.error) { S.err = 'Error: ' + r.error.message; alert('No se pudo guardar: ' + r.error.message); return true; } return false; };

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  if (S.busy) return;
  const a = b.dataset.act, d = b.dataset;
  try {
    if (a === 'login') {
      const email = $('#lmail').value.trim(), password = $('#lpass').value;
      if (!email || !password) { S.err = 'Escribe tu correo y clave'; render(); return; }
      S.busy = true; S.err = ''; render();
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { S.busy = false; S.err = 'Correo o clave incorrectos'; render(); return; }
      S.user = data.user; await cargar(); suscribir(); S.view = 'mesas'; S.busy = false; render(); return;
    }
    if (a === 'sonido') {
      const o = ['ambos', 'cocina', 'salon', 'off']; SND = o[(o.indexOf(SND) + 1) % o.length];
      try { localStorage.setItem('pr-snd', SND); } catch (x) {}
      if (SND === 'cocina' || SND === 'ambos') sonarCocina(); else if (SND === 'salon') sonarListo();
      pantalla(); render(); return;
    }
    if (a === 'olvide') { S.olvide = true; S.err = ''; S.ok = ''; render(); return; }
    if (a === 'volverlogin') { S.olvide = false; S.err = ''; S.ok = ''; render(); return; }
    if (a === 'enviarlink') {
      const email = $('#rmail').value.trim(); if (!email) { S.err = 'Escribe tu correo'; render(); return; }
      S.busy = true; S.err = ''; render();
      await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      S.busy = false; S.ok = 'Si el correo está registrado, te enviamos un enlace. Revisa tu bandeja (y spam).'; render(); return;
    }
    if (a === 'guardarclave') {
      const p1 = $('#np1').value, p2 = $('#np2').value;
      if (p1.length < 8) { S.err = 'La clave debe tener al menos 8 caracteres'; render(); return; }
      if (p1 !== p2) { S.err = 'Las claves no coinciden'; render(); return; }
      S.busy = true; S.err = ''; render();
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) { S.busy = false; S.err = 'No se pudo guardar: ' + error.message; render(); return; }
      history.replaceState(null, '', location.pathname); S.setpass = false;
      const { data } = await sb.auth.getSession(); S.user = data.session ? data.session.user : null;
      if (S.user) { await cargar(); suscribir(); }
      S.busy = false; render(); return;
    }
    if (a === 'a_crear' || a === 'a_add' || a === 'a_reenviar') {
      S.busy = true; S.av.msg = ''; S.av.err = ''; render();
      try {
        if (a === 'a_crear') {
          const j = await llamarAdmin({ action: 'create_local', nombre: S.af.nombre, mesas: S.af.mesas, email: S.af.email });
          S.av.msg = 'Local creado. ' + (j.persona.estado === 'invitado' ? 'Invitación enviada a ' : 'Asignado a ') + j.persona.email;
          S.af = { nombre: '', mesas: '6', email: '' };
        } else if (a === 'a_add') {
          const em = ($('#ae-' + d.lid) || {}).value || '';
          const j = await llamarAdmin({ action: 'add_user', local_id: d.lid, email: em });
          S.av.msg = (j.persona.estado === 'invitado' ? 'Invitación enviada a ' : 'Asignado: ') + j.persona.email;
        } else {
          await llamarAdmin({ action: 'resend_invite', email: d.email }); S.av.msg = 'Invitación reenviada a ' + d.email;
        }
        const l = await llamarAdmin({ action: 'list' }); S.av.locales = l.locales;
      } catch (x) { S.av.err = x.message; }
      S.busy = false; render(); return;
    }
    if (a === 'logout') { if (rt) { sb.removeChannel(rt); rt = null; } await sb.auth.signOut(); S.user = null; D = null; S.mesa = null; S.admin = false; S.av = { locales: [], cargado: false, msg: '', err: '' }; render(); return; }
    if (a === 'tab') { S.view = d.v; S.mesa = null; }
    else if (a === 'mesa') { S.mesa = +d.n; S.cart = {}; S.note = ''; S.cerrando = false; }
    else if (a === 'volver') { S.mesa = null; S.cerrando = false; }
    else if (a === 'inc') S.cart[d.id] = (S.cart[d.id] || 0) + 1;
    else if (a === 'dec') { S.cart[d.id] = Math.max(0, (S.cart[d.id] || 0) - 1); if (!S.cart[d.id]) delete S.cart[d.id]; }
    else if (a === 'cerrar') S.cerrando = true;
    else if (a === 'nocerrar') S.cerrando = false;
    else {
      S.busy = true;
      if (a === 'enviar') {
        const items = L().menu.filter(i => S.cart[i.id]).map(i => ({ n: i.n, q: S.cart[i.id], p: i.p }));
        if (items.length && !fallo(await sb.from('resto_comandas').insert({ local_id: D.id, mesa: S.mesa, items, nota: S.note.trim() }))) { S.cart = {}; S.note = ''; }
      } else if (a === 'pagar') {
        const ab = abiertas(S.mesa), tot = totalMesa(S.mesa);
        const r = await sb.from('resto_cuentas').insert({ local_id: D.id, mesa: S.mesa, total: tot, propina: S.propina ? Math.round(tot * 0.1) : 0, metodo: S.metodo, items: ab.flatMap(c => c.items) });
        if (!fallo(r)) { fallo(await sb.from('resto_comandas').update({ cerrada: true }).in('id', ab.map(c => c.id))); S.cerrando = false; S.mesa = null; }
      } else if (a === 'avanzar') fallo(await sb.from('resto_comandas').update({ estado: d.to }).eq('id', d.id));
      else if (a === 'toggle') { const i = L().menu.find(x => x.id === d.id); if (i) fallo(await sb.from('resto_menu').update({ activo: !i.on }).eq('id', d.id)); }
      else if (a === 'del') fallo(await sb.from('resto_menu').delete().eq('id', d.id));
      else if (a === 'add') {
        const n = $('#an').value.trim(), c = $('#ac').value.trim() || 'General', p = +$('#ap').value;
        if (n && p > 0) fallo(await sb.from('resto_menu').insert({ local_id: D.id, nombre: n, categoria: c, precio: Math.round(p) }));
      } else if (a === 'mesas') { const n = Math.min(60, Math.max(1, +$('#nm').value || 1)); fallo(await sb.from('resto_locales').update({ mesas: n }).eq('id', D.id)); }
      await cargar(); S.busy = false;
    }
  } catch (x) { S.busy = false; console.error(x); }
  render();
});
setInterval(async () => { if (S.user && D && !S.busy) { if (S.view === 'cocina' || S.view === 'mesas') { await cargar(); render(); } } }, 20000);
inicio();
</script>
</body>
</html>
